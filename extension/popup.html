<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 290px;
      margin: 0;
      padding: 16px;
      background: #141414;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h2 {
      margin: 0 0 6px 0;
      font-size: 16px;
      color: #ff5e00;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: #aaa;
      line-height: 1.4;
    }
    .status-card {
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .status-title {
      font-size: 11px;
      text-transform: uppercase;
      color: #888;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .track-name {
      font-size: 13px;
      color: #00ff88;
      word-break: break-all;
      font-weight: 500;
    }
    button {
      width: 100%;
      background: #ff5e00;
      border: none;
      color: #fff;
      font-weight: bold;
      font-size: 13px;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #e05300;
    }
    .footer {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>🎵 MusicPuller Companion</h2>
  <p>Play any track on Suno.com. This extension captures the direct stream bit-for-bit with <b>zero audio loss</b>.</p>

  <div class="status-card">
    <div class="status-title">Last Detected Stream</div>
    <div id="track-name" class="track-name">Waiting for playback on Suno...</div>
  </div>

  <button id="save-btn" disabled>⬇ Grab This Track Lossless</button>

  <div class="footer">Connected to MusicPuller (127.0.0.1:5000)</div>

  <script src="popup.js"></script>
</body>
</html>
