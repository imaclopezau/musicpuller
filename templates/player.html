<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suno Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --primary: #ff5e00;
            --primary-hover: #e05300;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at top left, #1a1a1a, #000000);
        }

        .app-container {
            display: flex;
            width: 90%;
            max-width: 1000px;
            height: 80vh;
            background: rgba(25, 25, 25, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Player Section */
        .player-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .cover-art {
            width: 250px;
            height: 250px;
            border-radius: 15px;
            background: linear-gradient(135deg, #ff5e00, #8000ff);
            box-shadow: 0 10px 30px rgba(255, 94, 0, 0.3);
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 64px;
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 10px 30px rgba(255, 94, 0, 0.2); }
            100% { box-shadow: 0 10px 40px rgba(255, 94, 0, 0.5); }
        }

        .track-info {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }

        .track-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            color: var(--text-muted);
            font-size: 14px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .btn-control {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
        }

        .btn-control:hover {
            color: var(--primary);
            transform: scale(1.1);
        }

        .btn-play {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 5px 15px rgba(255, 94, 0, 0.4);
        }
        
        .btn-play:hover {
            background-color: var(--primary-hover);
            color: white;
            transform: scale(1.05);
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .progress-bar-bg {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 3px;
            width: 0%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Playlist Section */
        .playlist-section {
            width: 350px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .playlist-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            font-size: 12px;
            color: var(--primary);
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .playlist {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding-right: 5px;
        }

        .playlist::-webkit-scrollbar {
            width: 6px;
        }
        .playlist::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        .playlist-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: var(--surface);
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
        }

        .playlist-item:hover {
            background: var(--surface-hover);
        }

        .playlist-item.active {
            background: rgba(255, 94, 0, 0.2);
            border-left: 4px solid var(--primary);
        }

        .item-icon {
            margin-right: 12px;
            color: var(--primary);
        }

        .item-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .empty-state {
            color: var(--text-muted);
            text-align: center;
            margin-top: 50px;
            font-size: 14px;
        }

    </style>
</head>
<body>

<div class="app-container">
    <div class="player-section">
        <div class="cover-art">🎵</div>
        
        <div class="track-info">
            <div class="track-title" id="current-title">Select a track</div>
            <div class="track-artist">Suno Downloader</div>
        </div>

        <div class="controls">
            <button class="btn-control" id="prev-btn">⏮</button>
            <button class="btn-control btn-play" id="play-btn">▶</button>
            <button class="btn-control" id="next-btn">⏭</button>
        </div>

        <div class="progress-container">
            <span id="current-time">0:00</span>
            <div class="progress-bar-bg" id="progress-container">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
            <span id="duration">0:00</span>
        </div>
        
        <audio id="audio-player"></audio>
    </div>

    <div class="playlist-section">
        <div class="playlist-header">
            <span>Your Tracks</span>
            <a href="/" class="back-link">Back to Downloader</a>
        </div>
        <ul class="playlist" id="playlist">
            {% if songs %}
                {% for song in songs %}
                <li class="playlist-item" data-src="/static/music/{{ song }}" data-title="{{ song }}">
                    <span class="item-icon">🎵</span>
                    <span class="item-name">{{ song }}</span>
                </li>
                {% endfor %}
            {% else %}
                <div class="empty-state">No downloaded tracks found. Go back and download some music!</div>
            {% endif %}
        </ul>
    </div>
</div>

<script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const currentTitle = document.getElementById('current-title');
    const playlistItems = document.querySelectorAll('.playlist-item');
    
    let currentIndex = 0;
    let isPlaying = false;

    if(playlistItems.length > 0) {
        loadTrack(0);
    }

    function loadTrack(index) {
        if(index < 0 || index >= playlistItems.length) return;
        
        // Remove active class
        playlistItems.forEach(item => item.classList.remove('active'));
        
        // Set new track
        currentIndex = index;
        const selectedItem = playlistItems[currentIndex];
        selectedItem.classList.add('active');
        
        audio.src = selectedItem.getAttribute('data-src');
        currentTitle.textContent = selectedItem.getAttribute('data-title');
        
        if (isPlaying) {
            audio.play();
        }
    }

    function togglePlay() {
        if (playlistItems.length === 0) return;
        
        if (audio.paused) {
            audio.play();
            playBtn.textContent = '⏸';
            isPlaying = true;
        } else {
            audio.pause();
            playBtn.textContent = '▶';
            isPlaying = false;
        }
    }

    playBtn.addEventListener('click', togglePlay);

    prevBtn.addEventListener('click', () => {
        let newIndex = currentIndex - 1;
        if (newIndex < 0) newIndex = playlistItems.length - 1;
        loadTrack(newIndex);
        if(isPlaying) audio.play();
    });

    nextBtn.addEventListener('click', () => {
        let newIndex = currentIndex + 1;
        if (newIndex >= playlistItems.length) newIndex = 0;
        loadTrack(newIndex);
        if(isPlaying) audio.play();
    });

    audio.addEventListener('ended', () => {
        let newIndex = currentIndex + 1;
        if (newIndex >= playlistItems.length) newIndex = 0;
        loadTrack(newIndex);
        audio.play();
    });

    audio.addEventListener('timeupdate', () => {
        if(isNaN(audio.duration)) return;
        const progressPercent = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = `${progressPercent}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
    });

    progressContainer.addEventListener('click', (e) => {
        if(isNaN(audio.duration)) return;
        const width = progressContainer.clientWidth;
        const clickX = e.offsetX;
        const duration = audio.duration;
        audio.currentTime = (clickX / width) * duration;
    });

    playlistItems.forEach((item, index) => {
        item.addEventListener('click', () => {
            loadTrack(index);
            audio.play();
            playBtn.textContent = '⏸';
            isPlaying = true;
        });
    });

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
</script>
</body>
</html>
